<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Aprobación</title>
    <link rel="stylesheet" href="Approvals.css">
</head>
<body>

    <h2>Aprobación de Siniestro</h2>

    <label>Estado:</label>
    <select>
        <option>Rechazado</option>
        <option>Aceptado</option>
        <option>Aceptado con pago de deducible</option>
        <option>Aceptado sin pago de deducible</option>
        <option>Aplica pago para reparación</option>
        <option>Pérdida total</option>
    </select><br><br>

    <label>Fecha compromiso (reparación o pago):</label>
    <input type="date"><br><br>

    <h3>Subir evidencia de reparación</h3>
    <input type="file" multiple><br><br>

    <button>Guardar Resolución</button>

</body>
</html>
